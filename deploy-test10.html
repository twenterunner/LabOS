<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>LabOS TEST-10 deployment check</title><style>body{font:16px system-ui;margin:0;padding:24px;background:#f4f8f8;color:#17363c}.box{max-width:720px;margin:auto;background:#fff;border:1px solid #cbdadb;border-radius:14px;padding:20px}button{padding:12px 16px;border:0;border-radius:10px;background:#0c5862;color:#fff;font-weight:800}</style></head><body><div class="box"><h1>LabOS TEST-10 deployment check</h1><p id="s">Checking published build…</p><button id="go" hidden>Clear stale shell and open TEST-10</button></div><script>fetch('labos-version.json?ts='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(v=>{const ok=v.buildId==='EXTERNAL-EXECUTION-FULL-BLEED-TEST10';s.textContent=ok?'PASS — published build is TEST-10':'FAIL — server reports '+(v.buildLabel||v.buildId||'unknown build');go.hidden=!ok}).catch(e=>s.textContent='FAIL — '+e.message);go.onclick=async()=>{try{if('serviceWorker'in navigator){for(const r of await navigator.serviceWorker.getRegistrations())await r.unregister()}if('caches'in window){for(const k of await caches.keys())await caches.delete(k)}}catch(e){}location.href='index.html?build=TEST10&ts='+Date.now()</script></body></html>
