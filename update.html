<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>Updating LabOS TEST-7…</title><style>body{font:16px/1.5 system-ui,sans-serif;margin:0;background:#f4f7f8;color:#17343a}.box{max-width:680px;margin:10vh auto;padding:24px;border:1px solid #d5e1e4;border-radius:18px;background:#fff;box-shadow:0 8px 30px #16343a14}strong{color:#0c5862}.ok{color:#176b3a}.bad{color:#9d2626}code{word-break:break-all}</style></head><body><div class="box"><strong>Updating LabOS · TEST-7</strong><p id="status">Removing stale application caches and checking the published build…</p><p id="detail"></p></div><script>
(async function(){const BUILD='MYWORK-RESOURCE-CARE-CLEANUP-TEST7',REV='1.0.185',status=document.getElementById('status'),detail=document.getElementById('detail');try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()));}if('caches'in window){const keys=await caches.keys();await Promise.all(keys.map(k=>caches.delete(k)));}try{for(let i=localStorage.length-1;i>=0;i--){const k=localStorage.key(i)||'';if(k.startsWith('protolab-cache-clean-')||k.startsWith('labos-cache-clean-'))localStorage.removeItem(k)}}catch(_e){}const v=await fetch('./labos-version.json?ts='+Date.now(),{cache:'no-store',headers:{'Cache-Control':'no-cache'}}).then(r=>{if(!r.ok)throw new Error('version '+r.status);return r.json()});if(String(v.buildId||'')!==BUILD){status.className='bad';status.textContent='The GitHub Pages deployment is not TEST-7 yet.';detail.innerHTML='Published build: <code>'+String(v.buildId||'(missing)')+'</code><br>Expected: <code>'+BUILD+'</code><br><br>This proves the repository/Pages publication is still serving another build; refreshing the app cannot fix that.';return;}status.className='ok';status.textContent='TEST-7 is published. Opening it with a unique cache-busted URL…';const u=new URL('./index.html',location.href);u.searchParams.set('labos_rev',REV);u.searchParams.set('labos_build',BUILD);u.searchParams.set('refresh',Date.now().toString());setTimeout(()=>location.replace(u.toString()),700);}catch(err){status.className='bad';status.textContent='Deployment check failed.';detail.textContent=String(err&&err.message||err);}})();
</script></body></html>
