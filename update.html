<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Updating LabOS…</title>
  <style>body{font:16px/1.5 system-ui,sans-serif;margin:0;background:#f4f7f8;color:#17343a}.box{max-width:620px;margin:12vh auto;padding:24px;border:1px solid #d5e1e4;border-radius:18px;background:white;box-shadow:0 8px 30px #16343a14}strong{color:#0c5862}</style>
</head>
<body>
  <div class="box"><strong>Updating LabOS to REV 1.0.176…</strong><p id="status">Removing stale application caches and reloading the current deployment.</p></div>
<script>
(async function(){
  const status=document.getElementById('status');
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.map(k=>caches.delete(k)));
    }
    // Keep LabOS user/demo data. Only forget prior cache-clean markers.
    try{
      for(let i=localStorage.length-1;i>=0;i--){
        const k=localStorage.key(i)||'';
        if(k.startsWith('protolab-cache-clean-')||k.startsWith('labos-cache-clean-')) localStorage.removeItem(k);
      }
    }catch(_e){}
    status.textContent='Cache cleared. Loading REV 1.0.176…';
  }catch(err){
    status.textContent='Cache cleanup completed as far as the browser allowed. Loading REV 1.0.176…';
  }
  const u=new URL('./index.html',location.href);
  u.searchParams.set('labos_rev','1.0.176');
  u.searchParams.set('refresh',Date.now().toString());
  location.replace(u.toString());
})();
</script>
</body>
</html>
