  <script>
    // REV 1.0.185 controlled-build deployment handshake. Both product revision and
    // rebuild checkpoint are fetched with cache bypass so same-revision GitHub deployments
    // can be distinguished without changing the product revision.
    (function(){
      const EXPECTED_REVISION='1.0.185';
      const EXPECTED_BUILD='STAGE3-GITHUB-TEST-7';
      window.__LABOS_EXPECTED_REVISION__=EXPECTED_REVISION;
      window.__LABOS_EXPECTED_BUILD__=EXPECTED_BUILD;
      const versionUrl='labos-version.json?ts='+Date.now();
      fetch(versionUrl,{cache:'no-store',headers:{'Cache-Control':'no-cache'}}).then(r=>{
        if(!r.ok) throw new Error('version '+r.status);
        return r.json();
      }).then(v=>{
        const liveRevision=String(v&&v.revision||'').trim();
        const liveBuild=String(v&&v.buildId||'').trim();
        const revisionMatches=!liveRevision||liveRevision===EXPECTED_REVISION;
        const buildMatches=!liveBuild||liveBuild===EXPECTED_BUILD;
        if(revisionMatches&&buildMatches){
          try{sessionStorage.removeItem('labos-update-attempt:'+EXPECTED_REVISION+':'+EXPECTED_BUILD)}catch(_e){}
          return;
        }
        const key='labos-update-attempt:'+liveRevision+':'+liveBuild;
        let attempted=false;
        try{attempted=sessionStorage.getItem(key)==='1'}catch(_e){}
        if(attempted){
          window.__LABOS_DEPLOYMENT_MISMATCH__={pageRevision:EXPECTED_REVISION,pageBuild:EXPECTED_BUILD,serverRevision:liveRevision,serverBuild:liveBuild};
          console.warn('LabOS deployment mismatch after refresh attempt',window.__LABOS_DEPLOYMENT_MISMATCH__);
          return;
        }
        try{sessionStorage.setItem(key,'1')}catch(_e){}
        const u=new URL(location.href);
        u.searchParams.set('labos_rev',liveRevision||EXPECTED_REVISION);
        u.searchParams.set('labos_build',liveBuild||EXPECTED_BUILD);
        u.searchParams.set('refresh',Date.now().toString());
        location.replace(u.toString());
      }).catch(err=>console.warn('LabOS revision/build check skipped',err));
    })();
  </script>
  <link rel="stylesheet" href="labos-styles-1.0.185.css?build=STAGE3-GITHUB-TEST-7" onerror="window.LabOSBootFail&&LabOSBootFail('labos-styles-1.0.185.css')" />
  <script>
    (function(){
      const bootErrors=[];window.__LABOS_BOOT_FATAL__=false;window.__LABOS_BOOT_PHASE__='shell';
      function message(title,detail){
        const p=document.getElementById('page');
        if(!p)return;
        p.innerHTML='<div style="max-width:760px;margin:28px auto;padding:18px;border:1px solid #e1a7a7;border-radius:12px;background:#fff7f7;color:#23343a;font:14px/1.45 system-ui,sans-serif"><strong style="display:block;font-size:18px;margin-bottom:6px">'+title+'</strong><div>'+detail+'</div></div>';
      }
      window.LabOSBootFail=function(file){
        bootErrors.push(file);window.__LABOS_BOOT_FATAL__=true;
        message('LabOS deployment is incomplete','Required runtime file <b>'+file+'</b> could not be loaded. Upload every file from the root of the LabOS deployment ZIP to the GitHub Pages repository root, then refresh.');
      };
      window.addEventListener('error',function(e){
        if(e && e.target && (e.target.tagName==='SCRIPT'||e.target.tagName==='LINK')) return;
        if(!window.__PROTOLAB_READY__ && e && e.message){window.__LABOS_BOOT_FATAL__=true;window.__LABOS_BOOT_PHASE__='runtime-error'; message('LabOS could not start','Runtime error: <b>'+String(e.message).replace(/[<>&]/g,'')+'</b>. The previous working data remains untouched.');}
      });
      window.addEventListener('unhandledrejection',function(e){
        if(!window.__PROTOLAB_READY__){window.__LABOS_BOOT_FATAL__=true;window.__LABOS_BOOT_PHASE__='promise-error';message('LabOS could not start','Startup failed before the application rendered. '+String(e.reason&&e.reason.message||e.reason||'Unknown startup error').replace(/[<>&]/g,''));}
      });
      // Proactively retire any legacy PWA worker/cache. This is best-effort and never blocks startup.
      try{
        if('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(rs=>Promise.all(rs.map(r=>r.unregister()))).catch(()=>{});
        if('caches' in window) caches.keys().then(ks=>Promise.all(ks.filter(k=>/protolab|labos/i.test(k)).map(k=>caches.delete(k)))).catch(()=>{});
      }catch(_e){}
      window.addEventListener('load',function(){
        setTimeout(function(){
          if(!window.__PROTOLAB_READY__ && !bootErrors.length && !window.__LABOS_BOOT_FATAL__){
            message('LabOS did not finish starting','The page shell loaded, but the application runtime did not finish initialization. Startup is still incomplete at phase <b>'+String(window.__LABOS_BOOT_PHASE__||'unknown')+'</b>. Refresh once; if it persists, this is an application startup defect rather than a missing-file assumption.');
          }
        },6000);
      });
    })();
  </script>
