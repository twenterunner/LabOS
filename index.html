<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0c5862" />
  <meta name="description" content="Prototype Build Management proof-of-concept for automotive engineering laboratories." />
  <title>LabOS — Prototype Build Management</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="stylesheet" href="styles.css?v=1.0.45" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div class="brand" role="button" tabindex="0" data-nav="dashboard" aria-label="Go to dashboard">
        <img class="brand-logo" src="labos-wordmark.png" alt="LabOS" />
        <span id="versionBadge" class="version-badge">REV 1.0.45</span>
      </div>
      <div class="top-actions">
        <div class="global-search-wrap">
          <input id="globalSearch" class="global-search" type="search" placeholder="Search request, serial, process, lot…" aria-label="Global search" />
          <div id="searchResults" class="search-results hidden"></div>
        </div>
        <button id="actionCentreButton" class="icon-button" aria-label="Open Action Centre"><span class="action-label">Actions</span> <span id="actionCount" class="badge">0</span></button>
        <label class="role-switcher"><span>Demo role</span><select id="roleSelect" aria-label="Demo role"></select></label>
        <button id="menuButton" class="icon-button mobile-only" aria-label="Open navigation">☰</button>
      </div>
    </header>

    <aside id="sidebar" class="sidebar" aria-label="Primary navigation">
      <nav id="mainNav"></nav>
      <div class="sidebar-footer">
        <div class="compliance-note">IATF 16949-aligned control support<br><small>POC — organisation configuration required</small></div>
        <button class="nav-link" data-nav="help">? Help & Manual</button>
      </div>
    </aside>

    <main id="main" class="main" tabindex="-1">
      <div id="page"></div>
    </main>
  </div>

  <div id="modalRoot"></div>
  <div id="toastRoot" aria-live="polite" aria-atomic="true"></div>

  <script src="core.js?v=1.0.45"></script>
  <script src="demo-data.js?v=1.0.45"></script>
  <script src="repository.js?v=1.0.45"></script>
  <script src="services.js?v=1.0.45"></script>
  <script src="app.js?v=1.0.45"></script>
</body>
</html>
