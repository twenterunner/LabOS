<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>LabOS TEST-6 deployment check</title><style>body{font:16px/1.5 system-ui,sans-serif;background:#f4f7f8;color:#17343a;margin:0}.box{max-width:720px;margin:9vh auto;padding:24px;background:white;border:1px solid #d5e1e4;border-radius:18px}.good{color:#176b3a}.bad{color:#9d2626}code{word-break:break-all}.button{display:inline-block;padding:10px 14px;border-radius:10px;background:#0c5862;color:white;text-decoration:none;font-weight:700}</style></head><body><div class="box"><h1>LabOS deployment check · TEST-6</h1><p><strong>This page itself is a deployment marker.</strong> It did not exist in TEST-4/TEST-5. If you can see it on GitHub Pages, the new file set has reached the Pages source.</p><div id="result">Checking <code>labos-version.json</code>…</div><p id="open"></p></div><script>(async()=>{const B='DEPLOYMENT-HARDENED-MYWORK-TEST6',r=document.getElementById('result'),o=document.getElementById('open');try{const v=await fetch('./labos-version.json?ts='+Date.now(),{cache:'no-store'}).then(x=>x.json());const ok=v.buildId===B;r.className=ok?'good':'bad';r.innerHTML=(ok?'PASS — published build is TEST-6.':'FAIL — Pages is serving a different build.')+'<br>Published build: <code>'+String(v.buildId||'(missing)')+'</code><br>Expected build: <code>'+B+'</code>';if(ok){o.innerHTML='<a class="button" href="./update.html?ts='+Date.now()+'">Clear stale shell and open TEST-6</a>'}}catch(e){r.className='bad';r.textContent='Could not read the live version marker: '+e.message}})();</script></body></html>
